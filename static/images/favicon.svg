<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="favRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF242E" />
      <stop offset="100%" stop-color="#C40510" />
    </linearGradient>
  </defs>

  <!-- Dark Background Container -->
  <rect width="120" height="120" rx="22" fill="#0B0B0E" />
  <rect x="2" y="2" width="116" height="116" rx="20" fill="none" stroke="#FF1E27" stroke-width="2" opacity="0.6" />

  <!-- Centered Crown & Shield Emblem -->
  <g transform="translate(10, 10)">
    <!-- 1. Crown -->
    <path d="M 20,38 L 26,18 L 38,30 L 50,6 L 62,30 L 74,18 L 80,38 Z" fill="#FFFFFF" stroke="#141419" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Crown Jewels -->
    <circle cx="26" cy="16" r="3" fill="#FFFFFF" stroke="#141419" stroke-width="2" />
    <circle cx="38" cy="28" r="3" fill="#FFFFFF" stroke="#141419" stroke-width="2" />
    <circle cx="50" cy="5" r="4" fill="#FFFFFF" stroke="#141419" stroke-width="2" />
    <circle cx="62" cy="28" r="3" fill="#FFFFFF" stroke="#141419" stroke-width="2" />
    <circle cx="74" cy="16" r="3" fill="#FFFFFF" stroke="#141419" stroke-width="2" />

    <!-- 2. Left Shield (White + Black E) -->
    <path d="M 20,40 L 50,40 L 50,96 L 20,68 Z" fill="#FFFFFF" stroke="#141419" stroke-width="4" stroke-linejoin="round" />
    <path d="M 30,50 L 44,50 L 44,57 L 36,57 L 36,63 L 42,63 L 42,69 L 36,69 L 36,75 L 44,75 L 44,82 L 30,73 Z" fill="#141419" />

    <!-- 3. Right Shield (Red + Red G) -->
    <path d="M 50,40 L 80,40 L 80,68 L 50,96 Z" fill="url(#favRedGrad)" stroke="#141419" stroke-width="4" stroke-linejoin="round" />
    <path d="M 70,50 L 56,50 L 56,82 L 70,70 L 70,64 L 64,64 L 64,58 L 70,58 Z" fill="url(#favRedGrad)" stroke="#141419" stroke-width="2" />
  </g>
</svg>
